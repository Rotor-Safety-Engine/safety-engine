[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotor-safety-engine"
version = "1.0.1"
description = "Real-time physics safety engine for robotics and VLA systems"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Rotor Dynamics", email = "contact@rotor-dynamics.ai"},
]
keywords = [
    "robotics", "safety", "vla", "physics", "embedded",
    "vision-language-action", "collaboration-robot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/rotor-dynamics/safety-engine"
Documentation = "https://github.com/rotor-dynamics/safety-engine#readme"
Issues = "https://github.com/rotor-dynamics/safety-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]
